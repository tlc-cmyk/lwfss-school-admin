<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a3a6c" />
  <meta name="description" content="世界龍岡學校劉皇發中學 · 學校行政系統" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="學校行政" />
  <title>學校行政系統</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="gate" class="gate">
    <h2>學校帳戶登入</h2>
    <p>請使用 <strong>@g.lwfss.edu.hk</strong> Google 帳戶登入<br />
      <span class="muted">劉皇發中學 · 學校行政系統</span></p>
    <div class="err" id="gate-err" aria-live="polite"></div>
    <button type="button" id="supabase-login" class="btn supabase-login" disabled>正在準備登入…</button>
    <div id="google-btn-slot" class="google-slot"></div>
  </div>

  <div id="app" class="hidden">
    <main class="wrap wrap-home">
      <!-- One top section: nav + date/time/Day/user + today’s items (no school branding) -->
      <section id="home-top" class="home-top" aria-label="今日概況" aria-live="polite">
        <nav class="home-top-nav" aria-label="主選單">
          <a href="index.html" class="active">主頁</a>
          <a href="timetable.html" data-staff-only>時間表</a>
          <a href="staff-deadlines.html" data-staff-only>文件</a>
          <button type="button" id="sign-out" class="home-top-nav-btn">登出</button>
        </nav>

        <div class="home-top-when-row">
          <div class="home-bar-when">
            <span id="home-date" class="home-bar-date">載入日期…</span>
            <span id="home-clock" class="home-bar-clock" aria-label="現在時間">--:--</span>
          </div>
          <label class="home-bar-pick" for="home-date-input" title="改日期">
            <span class="home-bar-pick-icon" aria-hidden="true">📅</span>
            <input type="date" id="home-date-input" class="home-bar-date-input" aria-label="選擇日期" />
          </label>
        </div>

        <div class="home-bar-meta">
          <span id="home-cycle" class="home-bar-day">載入循環日…</span>
          <span id="home-status" class="home-status-chip" hidden></span>
          <span id="home-who" class="home-bar-who"></span>
        </div>
        <div id="home-sched-label" class="home-bar-sched muted"></div>

        <div id="home-notes" class="home-top-notes" aria-label="今日事項" hidden>
          <div class="home-notes-head">
            <h2 class="home-notes-title">今日事項</h2>
            <a id="home-notes-all" class="home-notes-all" href="staff-deadlines.html" data-staff-only>全部文件遞交</a>
          </div>
          <ul id="home-notes-list" class="home-notes-list"></ul>
        </div>

        <!-- auth.js fills this; visually folded into home-who above -->
        <div id="signed-in-as" class="home-top-signed-sr" aria-live="polite"></div>
      </section>

      <!-- Slim module row -->
      <nav class="home-mods" aria-label="其他模組" data-role-view="staff">
        <a class="home-mod" href="timetable.html">完整時間表</a>
        <a class="home-mod" href="staff-deadlines.html">文件／會議</a>
        <span class="home-mod is-soon" title="稍後">即時空堂<span class="home-mod-soon">稍後</span></span>
        <span class="home-mod is-soon" title="稍後">約開會<span class="home-mod-soon">稍後</span></span>
      </nav>

      <!-- Timetable: D1–D10 + teacher + period cards -->
      <section class="home-tt" aria-label="課節時間表">
        <div id="home-day-grid" class="tt-day-grid" role="tablist" aria-label="循環日 D1–D10"></div>

        <div class="tt-teacher-row" data-role-view="staff">
          <label class="tt-teacher-label" for="home-teacher-select">查看教師</label>
          <select id="home-teacher-select" class="home-teacher-select" aria-label="選擇教師">
            <option value="">選擇教師…</option>
          </select>
          <span id="home-lesson-count" class="tt-lesson-count" hidden></span>
        </div>

        <p id="home-tt-status" class="muted tt-load-status"></p>
        <p id="home-tt-message" class="home-tt-message muted hidden"></p>

        <div id="home-tt-result" class="hidden">
          <div id="home-tt-meta" class="teacher-meta tt-teacher-meta"></div>
          <div id="home-periods" class="tt-periods"></div>
        </div>

        <div id="home-tt-student" class="tt-student-block hidden" data-role-view="student">
          <p class="home-tt-student-msg">學生時間表稍後推出。</p>
          <p class="muted">上線後會按你的班別顯示今日循環日課表。</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      世界龍岡學校劉皇發中學 · 須以 @g.lwfss.edu.hk 登入 · 時間表資料來自 Supabase
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="data/timetable.js"></script>
  <script src="js/home.js"></script>
</body>
</html>

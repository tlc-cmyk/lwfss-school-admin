<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a3a6c" />
  <meta name="description" content="世界龍岡學校劉皇發中學 · 學校行政系統" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="教師時間表" />
  <title>劉皇發中學 · 學校行政系統</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="gate" class="gate">
    <h2>學校帳戶登入</h2>
    <p>請使用 <strong>@g.lwfss.edu.hk</strong> Google 帳戶登入<br />
      <span class="muted">劉皇發中學 · 學校行政系統</span></p>
    <div class="err" id="gate-err" aria-live="polite"></div>
    <button type="button" id="supabase-login" class="btn supabase-login" disabled>正在準備登入…</button>
    <div id="google-btn-slot" class="google-slot"></div>
  </div>

  <div id="app" class="hidden">
    <header class="app-header app-header-slim">
      <div class="brand brand-slim">
        <div class="brand-mark">龍</div>
        <div>
          <h1>劉皇發中學</h1>
          <div class="sub">學校行政系統</div>
        </div>
      </div>
      <nav class="nav" aria-label="主選單">
        <a href="index.html" class="active">主頁</a>
        <a href="timetable.html" data-staff-only>時間表查詢</a>
        <a href="staff-deadlines.html" data-staff-only>文件／會議</a>
        <button type="button" id="sign-out" class="nav-btn">登出</button>
      </nav>
      <div id="signed-in-as" class="signed-in"></div>
    </header>

    <main class="wrap wrap-home">
      <!-- 1) Top dark-navy card -->
      <section id="tt-hero" class="tt-hero" aria-label="教師時間表今日概況" aria-live="polite">
        <div class="tt-hero-head">
          <h2 class="tt-hero-title">教師時間表</h2>
          <div id="tt-hero-who" class="tt-hero-who"></div>
        </div>

        <div class="tt-hero-clock-row">
          <span id="home-clock" class="tt-clock" aria-label="現在時間">--:--</span>
          <span id="home-status" class="tt-status-chip" hidden></span>
        </div>

        <div class="tt-hero-date-row">
          <span id="home-date" class="tt-date">載入日期…</span>
          <span id="home-today-pill" class="tt-today-pill" hidden>今日</span>
        </div>

        <div class="tt-hero-cycle-row">
          <div class="tt-cycle-block">
            <div id="home-cycle" class="tt-cycle-main">載入循環日…</div>
            <div id="home-cycle-sub" class="tt-cycle-sub">
              <span id="home-sched-label"></span>
              <a id="home-cal-link" class="tt-cal-mini" href="staff-deadlines.html" data-staff-only title="校曆／文件遞交">校曆</a>
            </div>
          </div>
          <label class="tt-change-date" for="home-date-input">
            <span class="tt-change-icon" aria-hidden="true">📅</span>
            <span class="tt-change-num" id="home-date-daynum">—</span>
            <span class="tt-change-hint">改日期</span>
            <input type="date" id="home-date-input" class="tt-date-input" aria-label="選擇日期" />
          </label>
        </div>

        <div id="home-remarks" class="tt-remarks"></div>
        <div id="home-duty" class="tt-meta-line" hidden></div>
        <div id="home-assembly" class="tt-meta-line" hidden></div>
        <ul id="home-event-list" class="tt-event-list"></ul>
      </section>

      <!-- 2) Pill tabs + D1–D10 -->
      <section class="tt-mid" aria-label="時間表導覽">
        <nav class="tt-pills" aria-label="功能分頁">
          <button type="button" class="tt-pill active" data-tab="cycle" aria-current="page">循環日課表</button>
          <button type="button" class="tt-pill is-soon" data-tab="nowfree" disabled title="稍後">即時空堂<span class="tt-soon">稍後</span></button>
          <button type="button" class="tt-pill is-soon" data-tab="meet" disabled title="稍後">約開會<span class="tt-soon">稍後</span></button>
          <button type="button" class="tt-pill is-soon" data-tab="overview" disabled title="稍後">全日概覽<span class="tt-soon">稍後</span></button>
          <button type="button" class="tt-pill is-soon" data-tab="cover" disabled title="稍後">代課<span class="tt-soon">稍後</span></button>
        </nav>

        <div id="home-day-grid" class="tt-day-grid" role="tablist" aria-label="循環日 D1–D10"></div>
      </section>

      <!-- 3) Bottom timetable -->
      <section class="tt-bottom card" aria-label="課節時間表">
        <div class="tt-bottom-head">
          <div id="home-day-title" class="tt-day-title">Day · —</div>
          <span id="home-lesson-count" class="tt-lesson-count" hidden></span>
        </div>

        <div class="tt-teacher-row" data-role-view="staff">
          <label class="tt-teacher-label" for="home-teacher-select">查看教師</label>
          <select id="home-teacher-select" class="home-teacher-select" aria-label="選擇教師">
            <option value="">選擇教師…</option>
          </select>
        </div>

        <div id="home-now-banner" class="tt-now-banner" hidden></div>
        <p id="home-tt-status" class="muted tt-load-status"></p>
        <p id="home-tt-message" class="home-tt-message muted hidden"></p>

        <div id="home-tt-result" class="hidden">
          <div id="home-tt-meta" class="teacher-meta tt-teacher-meta"></div>
          <div id="home-periods" class="tt-periods"></div>
        </div>

        <div id="home-tt-student" class="tt-student-block hidden" data-role-view="student">
          <p class="home-tt-student-msg">學生時間表稍後推出。</p>
          <p class="muted">上線後會按你的班別顯示今日循環日課表。</p>
        </div>
      </section>

      <section class="tt-quicklinks" aria-label="其他模組" data-role-view="staff">
        <a class="tt-qlink" href="timetable.html">完整時間表查詢</a>
        <a class="tt-qlink" href="staff-deadlines.html">文件遞交／校務會議</a>
      </section>
    </main>

    <footer class="footer">
      世界龍岡學校劉皇發中學 · 須以 @g.lwfss.edu.hk 登入 · 時間表資料來自 Supabase
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="data/timetable.js"></script>
  <script src="js/home.js"></script>
</body>
</html>

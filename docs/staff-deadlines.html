<!DOCTYPE html>
<html lang="zh-HK" data-tone="normal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a4d8c" />
  <meta name="description" content="文件遞交清單及校務會議 · 劉皇發中學學校行政系統" />
  <title>文件遞交清單及校務會議 · 學校行政系統</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="gate" class="gate">
    <h2>學校帳戶登入</h2>
    <p>請使用 <strong>@g.lwfss.edu.hk</strong> Google 帳戶登入<br />
      <span class="muted">劉皇發中學 · 學校行政系統</span></p>
    <div class="err" id="gate-err" aria-live="polite"></div>
    <button type="button" id="supabase-login" class="btn supabase-login" disabled>正在準備登入…</button>
    <div id="google-btn-slot" class="google-slot"></div>
  </div>

  <div id="app" class="hidden">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">龍</div>
        <div>
          <h1>文件遞交清單及校務會議</h1>
          <div class="sub">劉皇發中學 · 學校行政系統 · 僅供教職員</div>
        </div>
      </div>
      <nav class="nav" aria-label="主選單">
        <a href="index.html">主頁</a>
        <a href="timetable.html" data-staff-only>教師時間表</a>
        <a href="staff-deadlines.html" class="active" data-staff-only>文件遞交／校務會議</a>
        <button type="button" id="sign-out" class="nav-btn">登出</button>
      </nav>
      <div id="signed-in-as" class="signed-in"></div>
    </header>

    <main class="wrap wrap-wide">
      <section class="card" data-role-view="staff">
        <div class="deadlines-toolbar">
          <div>
            <h2 class="section-title">2026–2027 學年</h2>
            <p class="muted" id="deadlines-meta">載入中…</p>
          </div>
          <div class="deadlines-filters" role="group" aria-label="篩選">
            <button type="button" class="chip active" data-filter="upcoming">即將到期</button>
            <button type="button" class="chip" data-filter="all">全年</button>
          </div>
        </div>
        <p class="muted" style="margin-top:8px">資料來源：校曆表「文件遞交清單及校務會議」欄 ·
          <a href="assets/%E6%A0%A1%E6%9B%86%E8%A1%A8-2026-2027.pdf" target="_blank" rel="noopener">下載 PDF</a>
        </p>
        <div id="deadlines-err" class="err" style="min-height:1.2em;margin-top:6px;color:var(--danger)"></div>
        <div id="deadlines-list" class="deadlines-list" aria-live="polite"></div>
      </section>

      <section class="staff-only-note" data-role-view="student" aria-label="學生提示">
        <h2 style="color:var(--primary-dark);margin-bottom:8px;font-size:1.1rem">僅供教職員</h2>
        <p>文件遞交清單及校務會議只供教職員查閱。學生介面不會顯示此內容。</p>
        <p style="margin-top:12px"><a class="btn" href="index.html">返回主頁</a></p>
      </section>
    </main>

    <footer class="footer">
      須以 @g.lwfss.edu.hk 登入 · 教職員專用 · 資料來自 Supabase（RLS 職員名單）
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/staff-deadlines.js"></script>
</body>
</html>

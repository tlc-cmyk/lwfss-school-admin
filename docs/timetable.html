<!DOCTYPE html>
<html lang="zh-HK" data-tone="normal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a4d8c" />
  <meta name="description" content="教師時間表查詢 · 劉皇發中學學校行政系統" />
  <title>教師時間表 · 學校行政系統</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="gate" class="gate">
    <h2>學校帳戶登入</h2>
    <p>請使用 <strong>@g.lwfss.edu.hk</strong> Google 帳戶登入<br />
      <span class="muted">劉皇發中學 · 學校行政系統</span></p>
    <div class="err" id="gate-err" aria-live="polite"></div>
    <button type="button" id="supabase-login" class="btn supabase-login" disabled>正在準備登入…</button>
    <div id="google-btn-slot" class="google-slot"></div>
  </div>

  <div id="app" class="hidden">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">龍</div>
        <div>
          <h1>教師時間表</h1>
          <div class="sub">劉皇發中學 · 學校行政系統</div>
        </div>
      </div>
      <nav class="nav" aria-label="主選單">
        <a href="index.html">主頁</a>
        <a href="timetable.html" class="active" data-staff-only>教師時間表</a>
        <a href="staff-deadlines.html" data-staff-only>文件遞交／校務會議</a>
        <button type="button" id="sign-out" class="nav-btn">登出</button>
      </nav>
      <div id="signed-in-as" class="signed-in"></div>
    </header>

    <main class="wrap">
      <section id="today-banner" class="today-banner card" data-role-view="staff" aria-live="polite">
        <div class="today-banner-main" id="today-banner-text">正在載入今日循環日…</div>
        <div class="today-banner-sub muted" id="today-banner-sub"></div>
      </section>
      <section class="card" data-role-view="staff">
        <form id="search-form" class="search-row" autocomplete="off">
          <input id="code-input" type="search" enterkeyhint="search"
                 placeholder="ShortName（例如 TLC）" aria-label="教師代碼" />
          <button class="btn" type="submit">查詢</button>
        </form>
        <div class="err muted" id="search-err" style="min-height:1.2em;margin-top:6px;color:var(--danger)"></div>
        <div id="suggest" class="suggest" aria-label="建議"></div>
        <p id="data-info" class="muted" style="margin-top:10px"></p>
        <p id="cloud-note" class="muted hidden"></p>
      </section>

      <section id="result" class="card hidden">
        <div id="teacher-meta" class="teacher-meta"></div>
        <div id="day-tabs" class="day-tabs" role="tablist" aria-label="循環日"></div>
        <div id="periods" class="periods"></div>
      </section>

      <section class="staff-only-note" data-role-view="student" aria-label="學生提示">
        <h2 style="color:var(--primary-dark);margin-bottom:8px;font-size:1.1rem">教師時間表 · 僅供教職員</h2>
        <p>學生介面／班別時間表稍後推出。</p>
        <p style="margin-top:12px"><a class="btn" href="index.html">返回主頁</a></p>
      </section>
    </main>

    <footer class="footer">
      須以 @g.lwfss.edu.hk 登入 · 資料來自 Supabase 雲端資料庫 · 本機 JSON 為離線備份
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="data/timetable.js"></script>
  <script src="js/timetable.js"></script>
</body>
</html>
